<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecionando — Titan Turbo</title>
  <meta http-equiv="refresh" content="0;url=/checkout/">
  <link rel="canonical" href="https://titanturbo.com.br/checkout/">
</head>
<body>
<script>
  const plan = new URLSearchParams(location.search).get('plan') === 'life' ? 'life' : 'once';
  location.replace('/checkout/?plan=' + encodeURIComponent(plan));
</script>
</body>
</html>
